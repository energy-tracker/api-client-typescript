name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate tag and package versions
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"

  github-release:
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
